name: Build

on:
  workflow_call:

env:
  EMACS_VERSION: 29.1
  HUGO_VERSION: 0.139.4
  NODE_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod
          submodules: recursive

      - name: Set up Emacs ${{ env.EMACS_VERSION }}
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master
        with:
          version: ${{ env.EMACS_VERSION }}
      - name: Cache Emacs packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: content-org/.packages
          key: ${{ runner.os }}-emacs-${{ hashFiles('content-org/export.el') }}

      - name: Set up Hugo ${{ env.HUGO_VERSION }}
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --prod

      - name: Build content
        run: |
          cd content-org
          ./export.el 'notes/*.org'
      - name: Build website
        run: |
          pnpm build \
            --baseURL "$BASE_URL" \
            --destination "public"
          cp static/.* public/
          make compress
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && 'https://dev.notes.unindented.org/' || 'https://notes.unindented.org/' }}

      - name: Upload website
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website
          path: public
          retention-days: 1
          include-hidden-files: true
